version: "3.8"

services:
  kudu-master-1:
    image: apache/kudu:${KUDU_QUICKSTART_VERSION:-latest}
    ports:
      - "127.0.0.1:7051:7051"
      - "127.0.0.1:8051:8051"
    command: [ "master" ]
    volumes:
      - kudu-master-1:/var/lib/kudu
    environment:
      - KUDU_MASTERS=kudu-master-1:7051
      - "MASTER_ARGS=--fs_wal_dir=/var/lib/kudu/master \
        --rpc_bind_addresses=0.0.0.0:7051 \
        --rpc_advertised_addresses=localhost:7051 \
        --webserver_port=8051 \
        --webserver_advertised_addresses=localhost:8051 \
        --webserver_doc_root=/opt/kudu/www \
        --stderrthreshold=0 \
        --use_hybrid_clock=false \
        --default_num_replicas=1 \
        --unlock_unsafe_flags=true \
        --rpc_authentication=disabled \
        --rpc_encryption=disabled"

  kudu-tserver-1:
    image: apache/kudu:${KUDU_QUICKSTART_VERSION:-latest}
    depends_on:
      - kudu-master-1
    ports:
      - "127.0.0.1:7050:7050"
      - "127.0.0.1:8050:8050"
    command: [ "tserver" ]
    volumes:
      - kudu-tserver-1:/var/lib/kudu
    environment:
      - KUDU_MASTERS=kudu-master-1:7051
      - "TSERVER_ARGS=--fs_wal_dir=/var/lib/kudu/tserver \
        --rpc_bind_addresses=0.0.0.0:7050 \
        --rpc_advertised_addresses=localhost:7050 \
        --webserver_port=8050 \
        --webserver_advertised_addresses=localhost:8050 \
        --webserver_doc_root=/opt/kudu/www \
        --stderrthreshold=0 \
        --use_hybrid_clock=false \
        --unlock_unsafe_flags=true \
        --rpc_authentication=disabled \
        --rpc_encryption=disabled"

  kudu-tserver-2:
    image: apache/kudu:${KUDU_QUICKSTART_VERSION:-latest}
    depends_on:
      - kudu-master-1
    ports:
      - "127.0.0.1:7150:7150"
      - "127.0.0.1:8150:8150"
    command: [ "tserver" ]
    volumes:
      - kudu-tserver-2:/var/lib/kudu
    environment:
      - KUDU_MASTERS=kudu-master-1:7051
      - "TSERVER_ARGS=--fs_wal_dir=/var/lib/kudu/tserver \
        --rpc_bind_addresses=0.0.0.0:7150 \
        --rpc_advertised_addresses=localhost:7150 \
        --webserver_port=8150 \
        --webserver_advertised_addresses=localhost:8150 \
        --webserver_doc_root=/opt/kudu/www \
        --stderrthreshold=0 \
        --use_hybrid_clock=false \
        --unlock_unsafe_flags=true \
        --rpc_authentication=disabled \
        --rpc_encryption=disabled"

  ignite:
    image: apacheignite/ignite:2.15.0
    ports:
      - "10800:10800"
      - "47100:47100"
      - "47500:47500"
    environment:
      - IGNITE_QUIET=false

  kafka:
    image: apache/kafka:latest
    container_name: kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_NUM_PARTITIONS=3
    volumes:
      - kafka-data:/var/lib/kafka/data

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-storage:/var/lib/grafana
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  kudu-master-1:
  kudu-tserver-1:
  kudu-tserver-2:
  kafka-data:
  grafana-storage:
